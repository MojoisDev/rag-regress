[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-regress"
version = "0.1.0"
description = "Local-first retrieval regression testing for RAG pipelines"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "faiss-cpu>=1.8,<2",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "sentence-transformers>=3,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]
prototype = ["ollama>=0.4,<1"]

[project.scripts]
rag-regress = "rag_regress.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["model: requires a locally available Sentence Transformer model"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rag_regress"]
